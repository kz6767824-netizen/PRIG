name: PR Impact Guardian (PRIG) Check

on:
  pull_request:
    paths:
      - '**.sql'
      - 'migrations/**'

jobs:
  impact-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sqlparse

      - name: Find changed SQL files
        id: changed
        run: |
          echo "sql_files=$(git diff --name-only HEAD^ HEAD | grep '\.sql$' | tr '
' ' ')" >> $GITHUB_OUTPUT

      - name: Run PRIG offline impact analysis
        if: steps.changed.outputs.sql_files != ''
        run: |
          mkdir -p prig-reports
          for file in ${{ steps.changed.outputs.sql_files }}; do
            echo "Analyzing $file..."
            python -c "
import sys
sys.path.insert(0, 'agent')
from parse_migration import parse_migration
from severity import classify_migration
from severity_rollup import compute_overall_severity

with open('$file', 'r') as f:
    sql = f.read()

parsed = parse_migration(sql)
if not parsed['table']:
    print('Could not parse table name')
    continue

ops = parsed['operations']
# Offline: assume 0 downstream (conservative) since DataHub is not reachable in CI
downstream_lookup = {op.get('column'): 0 for op in ops if op.get('column')}
pii_lookup = {op.get('column'): False for op in ops if op.get('column')}
classified = classify_migration(ops, downstream_lookup, pii_lookup)
overall = compute_overall_severity(classified)

print(f"Table: {parsed['table']}")
print(f"Overall: {overall}")
for c in classified:
    print(f"  {c['column']}: {c['severity']} ({c['action']})")
"
          done

      - name: Generate impact report artifact
        if: steps.changed.outputs.sql_files != ''
        run: |
          python -c "
import sys, os
sys.path.insert(0, 'agent')
from parse_migration import parse_migration
from severity import classify_migration
from severity_rollup import compute_overall_severity
from report_builder import build_full_report

reports = []
for root, dirs, files in os.walk('.'):
    for f in files:
        if f.endswith('.sql'):
            path = os.path.join(root, f)
            with open(path, 'r') as file:
                sql = file.read()
            parsed = parse_migration(sql)
            if parsed['table']:
                table_urn = f"urn:li:dataset:(urn:li:dataPlatform:postgres,{parsed['table']},PROD)"
                report = build_full_report(
                    table=parsed['table'],
                    table_urn=table_urn,
                    operations=parsed['operations'],
                    use_llm=False,
                )
                reports.append(f'--- {path} ---\n{report}\n')

with open('prig-reports/offline-impact-report.md', 'w') as out:
    out.write('\n'.join(reports))
"

      - name: Upload report artifact
        if: steps.changed.outputs.sql_files != ''
        uses: actions/upload-artifact@v4
        with:
          name: prig-offline-reports
          path: prig-reports/
