name: PR Impact Guardian - Impact Check

on:
  pull_request:
    paths:
      - '**.sql'
      - 'migrations/**'
  workflow_dispatch:

jobs:
  impact-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install sqlparse
        run: pip install sqlparse

      - name: Find SQL files
        id: find_sql
        run: |
          SQL_FILES=$(find . -name "*.sql" -type f | tr '\n' ' ')
          echo "sql_files=${SQL_FILES}" >> "$GITHUB_OUTPUT"
          echo "Found SQL files: ${SQL_FILES}"

      - name: Run offline impact analysis
        if: steps.find_sql.outputs.sql_files != ''
        run: |
          mkdir -p prig-reports
          python3 << 'PYEOF'
          import sys
          import os
          sys.path.insert(0, 'agent')
          from parse_migration import parse_migration
          from severity import classify_migration
          from severity_rollup import compute_overall_severity

          reports = []
          for root, dirs, files in os.walk('.'):
              for f in files:
                  if not f.endswith('.sql'):
                      continue
                  path = os.path.join(root, f)
                  with open(path, 'r') as file:
                      sql = file.read()
                  parsed = parse_migration(sql)
                  if not parsed.get('table'):
                      continue
                  ops = parsed['operations']
                  downstream_lookup = {op.get('column'): 0 for op in ops if op.get('column')}
                  pii_lookup = {op.get('column'): False for op in ops if op.get('column')}
                  classified = classify_migration(ops, downstream_lookup, pii_lookup)
                  overall = compute_overall_severity(classified)
                  reports.append(f"## File: {path}")
                  reports.append(f"**Table:** `{parsed['table']}`  ")
                  reports.append(f"**Overall Severity:** `{overall}`  ")
                  reports.append("")
                  reports.append("| Operation | Column | Severity |")
                  reports.append("|---|---|---|")
                  for c in classified:
                      col = c.get('column', 'N/A')
                      reports.append(f"| {c['action']} | `{col}` | **{c['severity']}** |")
                  reports.append("")

          os.makedirs('prig-reports', exist_ok=True)
          with open('prig-reports/offline-impact-report.md', 'w') as out:
              out.write("# PRIG Offline Impact Report\n\n")
              out.write("\n\n".join(reports))
          print("Report generated at prig-reports/offline-impact-report.md")
          PYEOF

      - name: Upload report artifact
        if: steps.find_sql.outputs.sql_files != ''
        uses: actions/upload-artifact@v4
        with:
          name: prig-offline-reports
          path: prig-reports/
