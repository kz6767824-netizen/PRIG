name: PR Impact Guardian - Impact Check

on:
  pull_request:
    paths:
      - '**.sql'
      - 'migrations/**'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  impact-analysis:
    runs-on: ubuntu-latest
    env:
      DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL }}
      DATAHUB_GMS_TOKEN: ${{ secrets.DATAHUB_GMS_TOKEN }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install sqlparse requests

      - name: Find SQL files (excluding generated patches)
        id: find_sql
        run: |
          SQL_FILES=$(find . -name "*.sql" -type f ! -path "*/patches/*" ! -path "*/agent/patches/*" | tr '\n' ' ')
          echo "sql_files=${SQL_FILES}" >> "$GITHUB_OUTPUT"
          echo "Found SQL files: ${SQL_FILES}"

      - name: Run impact analysis
        id: run_analysis
        if: steps.find_sql.outputs.sql_files != ''
        run: |
          mkdir -p prig-reports
          python3 << 'PYEOF'
          import sys
          import os
          sys.path.insert(0, 'agent')

          from parse_migration import parse_migration
          from severity import classify_migration
          from severity_rollup import compute_overall_severity

          GMS_URL = os.environ.get("DATAHUB_GMS_URL", "").rstrip("/")
          GMS_TOKEN = os.environ.get("DATAHUB_GMS_TOKEN", "")
          LIVE_MODE = bool(GMS_URL and GMS_TOKEN)

          def get_downstream_count(table, env="PROD", platform="postgres"):
              """Live lineage lookup against DataHub via GraphQL. Returns 0
              (offline fallback) if secrets aren't configured or the call fails
              -- never raises, so the workflow degrades gracefully for forks
              that don't have a DataHub instance/tunnel configured."""
              if not LIVE_MODE:
                  return 0
              import requests
              table_urn = f"urn:li:dataset:(urn:li:dataPlatform:{platform},{table},{env})"
              query = """
              query GetLineage($urn: String!) {
                dataset(urn: $urn) {
                  downstream: lineage(input: { direction: DOWNSTREAM }) {
                    entities { urn type }
                  }
                }
              }
              """
              try:
                  resp = requests.post(
                      f"{GMS_URL}/api/graphql",
                      headers={
                          "Authorization": f"Bearer {GMS_TOKEN}",
                          "Content-Type": "application/json",
                      },
                      json={"query": query, "variables": {"urn": table_urn}},
                      timeout=15,
                  )
                  resp.raise_for_status()
                  data = resp.json()
                  entities = (
                      (data.get("data") or {})
                      .get("dataset", {})
                      .get("downstream", {})
                      .get("entities", [])
                      or []
                  )
                  print(f"[lineage] {table_urn}: {len(entities)} downstream entities")
                  return len(entities)
              except Exception as e:
                  print(f"[lineage] WARNING: lookup failed for {table_urn}: {e}")
                  return 0

          reports = []
          any_critical = False

          for root, dirs, files in os.walk('.'):
              if 'patches' in root.split(os.sep):
                  continue
              for f in files:
                  if not f.endswith('.sql'):
                      continue
                  path = os.path.join(root, f)
                  with open(path, 'r') as file:
                      sql = file.read()

                  parsed = parse_migration(sql)
                  if not parsed.get('table'):
                      continue

                  table = parsed['table']
                  ops = parsed['operations']

                  downstream_count = get_downstream_count(table)
                  downstream_lookup = {op.get('column'): downstream_count for op in ops if op.get('column')}
                  pii_lookup = {op.get('column'): False for op in ops if op.get('column')}

                  classified = classify_migration(ops, downstream_lookup, pii_lookup)
                  overall = compute_overall_severity(classified)

                  if any(c['severity'] == 'Critical' for c in classified):
                      any_critical = True

                  reports.append(f"## File: `{path}`")
                  reports.append(f"**Table:** `{table}`")
                  reports.append(f"**Overall Severity:** `{overall}`")
                  reports.append("")
                  reports.append("| Operation | Column | Severity |")
                  reports.append("|---|---|---|")
                  for c in classified:
                      col = c.get('column', 'N/A')
                      reports.append(f"| {c['action']} | `{col}` | **{c['severity']}** |")
                  reports.append("")

          if LIVE_MODE:
              note = (
                  "> **Note:** This report includes live downstream lineage counts "
                  "from your DataHub instance.\n"
              )
          else:
              note = (
                  "> **Note:** This CI check ran offline (no DataHub connection "
                  "configured), so downstream lineage counts are not available -- "
                  "severity reflects structural risk only (type changes, table "
                  "drops, ambiguous renames, PII overrides).\n"
              )

          header = "# PRIG Impact Report\n\n" + note + "\n"
          body = "\n\n".join(reports) if reports else "_No recognizable SQL operations found._"

          os.makedirs('prig-reports', exist_ok=True)
          with open('prig-reports/offline-impact-report.md', 'w') as out:
              out.write(header + body)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as gh_out:
              gh_out.write(f"any_critical={'true' if any_critical else 'false'}\n")

          print("Report generated at prig-reports/offline-impact-report.md")
          print(f"any_critical={any_critical}, live_mode={LIVE_MODE}")
          PYEOF

      - name: Upload report artifact
        if: steps.find_sql.outputs.sql_files != ''
        uses: actions/upload-artifact@v4
        with:
          name: prig-offline-reports
          path: prig-reports/

      - name: Post impact report as PR comment
        if: steps.find_sql.outputs.sql_files != '' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = 'prig-reports/offline-impact-report.md';
            let body = fs.readFileSync(path, 'utf8');

            const MAX_LEN = 60000;
            if (body.length > MAX_LEN) {
              body = body.slice(0, MAX_LEN) + '\n\n_...report truncated, see full artifact in the Actions run._';
            }

            const marker = '<!-- prig-impact-report -->';
            const commentBody = `${marker}\n## PR Impact Guardian -- Impact Report\n\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }

      - name: Fail build if Critical severity detected
        if: steps.find_sql.outputs.sql_files != '' && steps.run_analysis.outputs.any_critical == 'true'
        run: |
          echo "::error::PR Impact Guardian detected at least one CRITICAL severity change. See the PR comment for details. Blocking merge."
          exit 1
