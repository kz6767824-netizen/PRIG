name: PRIG Safe SQL Patch Generator

on:
  pull_request:
    paths:
      - '**.sql'
      - 'migrations/**'

jobs:
  generate-patch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sqlparse

      - name: Find changed SQL files
        id: changed
        run: |
          echo "sql_files=$(git diff --name-only HEAD^ HEAD | grep '\.sql$' | tr '
' ' ')" >> $GITHUB_OUTPUT

      - name: Generate remediation patches
        if: steps.changed.outputs.sql_files != ''
        run: |
          mkdir -p patches
          for file in ${{ steps.changed.outputs.sql_files }}; do
            python -c "
import sys
sys.path.insert(0, 'agent')
from parse_migration import parse_migration
from patch_generator import save_patch_file

with open('$file', 'r') as f:
    sql = f.read()

parsed = parse_migration(sql)
if parsed['table'] and parsed['operations']:
    save_patch_file(parsed['table'], parsed['operations'], output_dir='patches')
"
          done

      - name: Upload SQL Patch Artifact
        if: steps.changed.outputs.sql_files != ''
        uses: actions/upload-artifact@v4
        with:
          name: safe-migration-patches
          path: patches/*.sql
